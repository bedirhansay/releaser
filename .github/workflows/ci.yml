name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values let `prisma generate` + `next build` run without real
    # secrets. The server only validates these at runtime, not at build time.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/releaser
      AUTH_SECRET: ci-placeholder-secret
      TOKEN_ENCRYPTION_KEY: ci-placeholder-encryption-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
